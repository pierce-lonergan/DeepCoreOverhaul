name: Build DeepCoreOverhaul (Debug and Release)

# NOTE ON THE ARTIFACT CONTENTS
# The produced artifact contains ONLY the DLL and the settings/data files -- it is
# deliberately NOT runnable on its own. Upstream's workflow also moved an OpenLRR.exe
# from the repo root into the artifact; that file was the original 1999 game executable
# with an import appended, so it was removed from this fork (see NOTICE.md) and those
# Move-Item steps were deleted. Users generate their own launcher from their own copy
# of the game with OpenLRR-MakeExe, or use the injector.

on:
  push:
    paths:
      - src/**
      - resources/**
      - data/**
      - tools/**
      - .github/workflows/**
    tags: 'v*'
    branches: '**'
  pull_request:
    branches: '**'

jobs:
  # Runs first and gates everything else: if the exe's data-segment layout is
  # inconsistent, nothing built on top of it can be trusted.
  Address_space_lint:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: addrlint self-tests
        run: python tools/addrlint/test_addrlint.py
      - name: No overlapping exe-overlaid regions
        run: python tools/addrlint/addrlint.py --check
      - name: Documentation numbers agree with the tree
        run: python tools/docsaudit/docsaudit.py --check
      - name: docs/ADDRESS-MAP.md is up to date
        run: |
          python tools/addrlint/addrlint.py --markdown /tmp/ADDRESS-MAP.md --quiet
          diff -u docs/ADDRESS-MAP.md /tmp/ADDRESS-MAP.md \
            || (echo "::error::docs/ADDRESS-MAP.md is stale. Regenerate with: python tools/addrlint/addrlint.py --markdown docs/ADDRESS-MAP.md" && exit 1)

  # The repository must never distribute game content. This is a hard line in the
  # project mandate, so it is enforced mechanically rather than by memory.
  No_game_binaries:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v4
      - name: Reject tracked executables and game archives
        run: |
          BAD=$(git ls-files | grep -iE '\.(exe|dll|wad)$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::Tracked binaries that must never be committed:"
            echo "$BAD"
            exit 1
          fi
          echo "No tracked .exe/.dll/.wad files."

  # Runs the pure-logic tests and fuzzers. This is the only thing in the project that
  # actually EXECUTES shipped decision-making code -- the game itself cannot be run here --
  # so it gates the builds rather than merely reporting.
  Harness:
    runs-on: windows-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v4
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2
      - name: Build harness
        run: msbuild tools/harness/harness.vcxproj /p:Configuration=Release /p:Platform=x86 /p:SolutionDir=$PWD\
      - name: Run tests and fuzzers
        run: |
          .\bin\harness.exe --no-bench
          if ($LASTEXITCODE -ne 0) { throw "harness reported $LASTEXITCODE failure(s)" }

  Release_build:
    runs-on: windows-latest
    needs: [Address_space_lint, No_game_binaries, Harness]
    steps:
      - name: Clone repo
        uses: actions/checkout@v4
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2
      - name: Build x86 Release
        run: msbuild openlrr.sln /t:openlrr /p:Configuration=Release /p:Platform=x86
      - name: Stage artifact
        run: |
          mkdir -p artifact/DeepCoreOverhaul
          Move-Item bin/openlrr.dll artifact/DeepCoreOverhaul/
          Copy-Item -Recurse data/* artifact/DeepCoreOverhaul/
          Copy-Item NOTICE.md artifact/DeepCoreOverhaul/
      - name: Upload Release build
        uses: actions/upload-artifact@v4
        with:
          name: DeepCoreOverhaul-Release
          path: artifact/

  Debug_build:
    runs-on: windows-latest
    needs: [Address_space_lint, No_game_binaries, Harness]
    steps:
      - name: Clone repo
        uses: actions/checkout@v4
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2
      - name: Build x86 Debug
        run: msbuild openlrr.sln /t:openlrr /p:Configuration=Debug /p:Platform=x86
      - name: Stage artifact
        run: |
          mkdir -p artifact/DeepCoreOverhaul
          Move-Item bin/openlrr-d.dll artifact/DeepCoreOverhaul/
          Copy-Item -Recurse data/* artifact/DeepCoreOverhaul/
          Copy-Item NOTICE.md artifact/DeepCoreOverhaul/
      - name: Upload Debug build
        uses: actions/upload-artifact@v4
        with:
          name: DeepCoreOverhaul-Debug
          path: artifact/
