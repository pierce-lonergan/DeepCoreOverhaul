;;;;;;;;;;;;;;;;;;; DEEPCOREOVERHAUL SETTINGS FILE ;;;;;;;;;;;;;;;;;;;;;;;;
; This file follows the same syntax as Lego.cfg, .ol, .ptl, and .ae files.
; Whitespace and comments separate property names and values.
; Use ';' to comment out and ignore text (NOTE "//" IS NOT A COMMENT).
; Text in this file is case-insensitive.
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;
; EVERY FEATURE DEFAULTS TO FALSE, AND FALSE MEANS VANILLA BEHAVIOUR.
;
; That is deliberate. Deleting this file, or leaving it entirely commented out,
; gives you stock OpenLRR. Turn features on one at a time -- if something
; misbehaves, that is how you will find which one.
;
; Note also: these features have been compile-verified but NOT play-tested,
; because they were authored on a machine with no installation of the game.
; Treat anything you switch on here as untested until you have run it.
;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

Lego* {

	DeepCore {

		;;;;;;;;;;;;;;;;;;;;;;;;;; DIAGNOSTICS ;;;;;;;;;;;;;;;;;;;;;;;;;;;;

		; Print every resolved setting at startup. Use this first to confirm
		; the game is finding this file at all.
		VerboseStartup					FALSE


		;;;;;;;;;;;;;;;;;;;;;;;; MONSTER DENSITY ;;;;;;;;;;;;;;;;;;;;;;;;;;
		;
		; Vanilla ships ONE monster species per mission. The level format has a
		; single EmergeCreature entry, so although eleven species exist in the
		; game's object tables, a given map can only ever emerge one of them.
		;
		; These options do not add species and cannot add species -- the engine
		; has a hard ceiling of 15 object IDs per category and roughly eleven
		; are already spoken for. What they change is how many of the EXISTING
		; species you actually meet, and how often.

		; Let different emerge triggers in one level spawn different species.
		MultiSpeciesEmerge				FALSE

		; The species rotation, by monster type name. Trigger 0 gets the first
		; name, trigger 1 the second, and so on, wrapping around. Assignment is
		; by trigger index and therefore STABLE: a given cavern breeds the same
		; species all mission long, so players can learn the map.
		;
		; This list is EMPTY by default and an empty list means vanilla behaviour,
		; even with MultiSpeciesEmerge TRUE. That is on purpose -- the names that
		; actually exist come from YOUR Lego.cfg RockMonsterTypes block, which this
		; project has never been able to read. Any name that does not resolve is
		; reported and skipped rather than silently ignored.
		;
		; These are the names the base game defines. Uncomment and edit to taste;
		; the three big monsters are the sane starting point, since Bat, Slug and
		; SmallSpider are not really wall-emerging creatures:
		;
		;   RockMonster  IceMonster  LavaMonster
		;   TinyRM  TinyIM  Bat  Slug  SmallSpider
		;   Spider  Snake  Scorpion        ; unused by the base game
		;
		;EmergeSpeciesPool				RockMonster IceMonster LavaMonster

		; ---- THE WAVE DIRECTOR ----------------------------------------
		;
		; A mission's threat is entirely front-loaded into map data: emerge
		; triggers fire when you drill a particular tile, and once you know a
		; map it stops being dangerous. Nothing escalates.
		;
		; The director adds pressure the map does not know about: waves on a
		; timer, scaling with mission length, budgeted against what is already
		; alive, and always TELEGRAPHED. A wave you could not have seen coming
		; is not difficulty, it is a coin flip.
		;
		; It adds no species and no object IDs. Everything it spawns is a
		; creature the level already loaded. Combine it with CreatureVariants
		; above and the same three species stop looking like three species.

		WaveDirector					FALSE

		; Seconds between waves at the start of a mission.
		WaveIntervalSeconds				150.0

		; Mission-seconds over which the interval halves; 0 = flat cadence.
		; This is what makes a long mission tighten instead of settling into a
		; rhythm you stop noticing.
		WaveRampSeconds					600.0

		; Floor on the ramped interval, so escalation never becomes a stream.
		WaveMinIntervalSeconds			45.0

		; Seconds of warning before a wave lands. THIS IS THE FAIRNESS DIAL.
		; The warning names the place the wave will actually arrive, so the
		; time is usable. Set it to 0 only if you want to be cruel.
		WaveTelegraphSeconds			6.0

		; Creatures in the first wave; grows by one every three waves.
		WaveSize						1

		; Ceiling on any single wave, however far the ramp has run.
		WaveSizeMax						4

		; Ceiling on creatures alive at once. Counts monsters the MAP spawned
		; too, so the director never stacks on top of an already-hostile level.
		WaveMaxAlive					6

		; Minimum blocks between a spawn and any of your buildings. Your base
		; is the one place you are entitled to feel safe until something walks
		; there.
		WaveMinDistanceFromBase			8

		; Camera shake on the warning. 0 disables.
		WaveShakeIntensity				0.35
		WaveShakeDuration				1.5

		; Species the director may use, by monster type name. Empty means "use
		; whatever this level's own EmergeCreature is", which is always safe.
		; Same caveat as EmergeSpeciesPool: these names must exist in YOUR
		; Lego.cfg, and unresolvable ones are reported and skipped.
		;
		;WaveSpeciesPool				RockMonster IceMonster LavaMonster


		;;;;;;;;;;;;;;;;;;;;;;; CREATURE VARIANTS ;;;;;;;;;;;;;;;;;;;;;;;;;;
		;
		; Model scale and per-group colour are data-driven, and the base game
		; already recolours energy crystals this way. So a hulking dark-red
		; brute and a small pale skitterer can be the same mesh with different
		; numbers -- apparent variety with no new art and no new object IDs.

		CreatureVariants				FALSE

		; Variant table. Each row is:
		;
		;     <Label>    <SpeciesName> <Scale> <R>:<G>:<B>
		;
		; Scale multiplies the model's own size. Tint multiplies its colour, so
		; 1:1:1 is untouched, 0.5:0.25:0.25 is a dark red, 1:1:1.4 is a cold blue.
		; The tint is optional -- give just a species and a scale to resize only.
		;
		; Monsters of a species CYCLE through that species' rows in order: the
		; first Rock Monster you meet is a Brute, the second a Runt, the third a
		; Brute again. Cycling rather than rolling dice means you actually see
		; every variant, and a bug report reproduces.
		;
		; Rows naming a species that does not exist are reported and skipped.
		; Uncomment to try, once you have confirmed these names exist in your
		; own Lego.cfg RockMonsterTypes block:

		Variants {
			;Brute		RockMonster 1.45 0.55:0.30:0.30
			;Runt		RockMonster 0.70 0.90:0.90:1.00
			;Glacial	IceMonster  1.35 0.70:0.85:1.00
			;Cinder		LavaMonster 0.75 1.00:0.55:0.25
		}


		;;;;;;;;;;;;;;;;;;;;;;; WEAPON APPEARANCE ;;;;;;;;;;;;;;;;;;;;;;;;;;
		;
		; Weapon TYPES are one of the few things in this engine that are NOT
		; capped -- the game counts however many entries your WeaponTypes block
		; has and allocates that many. But every laser looked identical no
		; matter which weapon fired it, because the beam's appearance was
		; hardcoded in one place. A roster of new weapons that all look the
		; same reads as one weapon, so this is what makes new weapons land.

		WeaponBeamStyles				FALSE

		; Each row is:
		;
		;   <Label>  <WeaponName> <inThick>:<r>:<g>:<b>:<a> <outThick>:<r>:<g>:<b>:<a> [frames]
		;
		; A laser is two stacked beams: a bright thin core and a wider glow.
		; The trailing frame count is optional and controls how long the beam
		; lingers. The stock beam is exactly:
		;
		;   0.3:0.6:0.6:0.6:1.0   1.0:0.1:0.2:0.5:1.0   5.0
		;
		; WeaponName must match a name in YOUR Lego.cfg WeaponTypes block.
		; Unmatched weapons keep the stock beam and are reported once.

		BeamStyles {
			;Lazer			Lazer			0.3:0.6:0.6:0.6:1.0  1.0:0.1:0.2:0.5:1.0  5.0
			;PusherBeam		Pusher			0.5:0.8:0.9:1.0:1.0  1.6:0.2:0.5:0.9:0.8  7.0
			;FreezerBeam	Freezer			0.4:0.8:1.0:1.0:1.0  1.4:0.4:0.8:1.0:0.7  9.0
			;LaserBeam		LaserBeam		0.2:1.0:0.9:0.6:1.0  0.9:1.0:0.35:0.1:1.0 4.0
		}


		;;;;;;;;;;;;;;;;;;;;;;;;;;; STABILITY ;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
		;
		; The original engine calls a fatal error -- an outright crash to
		; desktop -- when a map has more than 10 water pools, or more than 100
		; tiles in any one pool. Community-made maps have been dying on this
		; for twenty-five years.
		;
		; This does NOT raise those limits, and nothing can: the water tables
		; live inside a struct overlaid on the original executable's own memory
		; at a fixed address, so growing them would overwrite whatever the game
		; keeps next door. What this does is turn six crash-to-desktop calls
		; into a warning plus a skip. An oversized map then LOADS AND PLAYS,
		; with some water left unsimulated, instead of killing the process.
		;
		; Turn this on if a map you want to play crashes on load with a water
		; error. Leave it off otherwise -- silently unsimulated water is a
		; worse default than a loud failure.

		SurviveWaterOverflow			FALSE

		; The real fix for the same problem: move the water tables out of the
		; original executable's memory and into this DLL, where they have no
		; size limit at all. Nothing is skipped and nothing is truncated -- a
		; lake of any size is simulated in full, and a map may have as many
		; separate bodies of water as it likes.
		;
		; This still does NOT grow the original struct, and nothing ever will.
		; The struct stays exactly the size and address it has always been, and
		; is simply left empty while this is on, so any original code that still
		; looks at it sees "no water" and does nothing.
		;
		; This SUPERSEDES SurviveWaterOverflow. With this on, the overflow
		; warnings above can no longer happen, so the older option becomes
		; irrelevant. Both are kept for now, and the older one remains the
		; fallback if this misbehaves. Turn on one or the other, not both.
		;
		; ONE SIDE EFFECT, and it is deliberate: the [W] debug keybind stops
		; working while this is on. That key is the single place in the game
		; that hands a water pool back to original 1999 machine code, and what
		; that code does with it was never worked out. Declining the key is
		; safer than guessing. You are told once, in the log, if you press it.

		RelocateWaterTables				FALSE

		; Sanity ceilings for the relocated tables. These are NOT engine limits
		; and they are not there to shape gameplay -- they exist so that a
		; corrupt surface map cannot make the loader allocate forever. The
		; defaults are far past anything a real map contains: a map would need
		; four thousand separate bodies of water, or a single lake of sixty-five
		; thousand tiles, to reach them. Ignored unless RelocateWaterTables.

		WaterMaxPools					4096
		WaterMaxPoolBlocks				65536

	}

}
