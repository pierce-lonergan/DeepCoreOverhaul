[/Script/EngineSettings.GameMapsSettings]
; An empty engine map. Everything visible is spawned by ADeepCoreGameMode::BeginPlay, which
; is what allows this project to contain no content assets of its own.
EditorStartupMap=/Engine/Maps/Entry.Entry
GameDefaultMap=/Engine/Maps/Entry.Entry
GlobalDefaultGameMode=/Script/DeepCore.DeepCoreGameMode

[/Script/Engine.RendererSettings]
; ---------------------------------------------------------------------------------------
; LUMEN, AND WHY IT WAS DOING NOTHING
;
; Lumen was switched on in the first commit of this project and contributed exactly zero.
; Verified in engine source: PrimitiveSceneProxy.cpp:1724-1734 computes bVisibleInLumenScene,
; and with hardware ray tracing OFF it takes the software branch, which requires
;     SupportsDistanceFieldRepresentation() || SupportsHeightfieldRepresentation()
; ProceduralMeshComponent implements NEITHER -- the whole plugin contains zero occurrences of
; the string "DistanceField". So every piece of geometry in this game was invisible to Lumen:
; no bounce light, no surface cache, no reflections. What the earlier screenshots showed was a
; directional light, a sky light and screen-space AO. That is the whole reason they read flat.
;
; Mesh distance fields cannot rescue the software path either: they are generated under
; WITH_EDITORONLY_DATA and r.GenerateMeshDistanceFields is read-only, so nothing this game
; rebuilds at runtime will ever have one. The hardware branch by contrast tests
; HasRayTracingRepresentation(), which ProceduralMeshComponent.cpp:424 returns literal true,
; and PMC already builds an FRayTracingGeometry per mesh section. HWRT is therefore not a
; quality nicety here -- it is the only path on which this game's geometry is lit at all.
;
; ORDER MATTERS. r.SkinCache.CompileShaders must come BEFORE ray tracing: it defaults to 0 and
; is read-only (GPUSkinCache.cpp:93-94), and RenderUtils.cpp:1041-1045 raises a Fatal log -- a
; hard crash on boot -- if ray tracing is enabled while it is 0. It cannot be set at runtime.
r.SkinCache.CompileShaders=1
r.RayTracing=1
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=1
; Mode 1 = compute lighting at the ray hit point, for GI *and* reflections. The default (0,
; SurfaceCache) shades from mesh cards, and a procedural mesh has none, so it would have
; nothing to read. Mode 2 would fix reflections only.
r.Lumen.HardwareRayTracing.LightingMode=1

r.Shadow.Virtual.Enable=1
r.DefaultFeature.AntiAliasing=2
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
r.AllowStaticLighting=False

; Volumetric fog is the atmosphere of this entire game. An underground heading is defined by
; the dust hanging in the lamp beams as much as by its walls.
r.VolumetricFog=1
r.VolumetricFog.GridPixelSize=8
r.VolumetricFog.GridSizeZ=128

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
; SM6 IS REQUIRED, AND ITS ABSENCE IS SILENT.
;
; Ray tracing and Lumen hardware ray tracing both need Shader Model 6. Without this the RHI
; comes up at SM5 -- the log line is "Using Highest Feature Level of D3D12: SM5" -- and every
; ray tracing cvar still reads back as 1 while nothing whatsoever is traced. That combination
; is genuinely nasty to diagnose: r.RayTracing=1, r.Lumen.HardwareRayTracing=1 and a GPU
; reporting "Max supported Feature Level 12_2, shader model 6.7" all agree that it should
; work, and the frame just looks flat.
;
; The default list contains SM5 as well, so SM5 has to be removed rather than merely
; supplemented -- the engine picks the HIGHEST level present, but only from the targeted list.
+D3D12TargetedShaderFormats=PCD3D_SM6
-D3D12TargetedShaderFormats=PCD3D_SM5
