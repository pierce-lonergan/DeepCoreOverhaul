[/Script/EngineSettings.GameMapsSettings]
; An empty engine map. Everything visible is spawned by ADeepCoreGameMode::BeginPlay, which
; is what allows this project to contain no content assets of its own.
EditorStartupMap=/Engine/Maps/Entry.Entry
GameDefaultMap=/Engine/Maps/Entry.Entry
GlobalDefaultGameMode=/Script/DeepCore.DeepCoreGameMode

[/Script/Engine.RendererSettings]
; Lumen is the reason for this port. Brick geometry is all hard edges and tight corners, and
; screen-space AO alone leaves those corners flat; traced bounce light is what makes stacked
; bricks read as solid objects sitting in a cave.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=0
r.Shadow.Virtual.Enable=1
r.DefaultFeature.AntiAliasing=2
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
r.GPUSkin.Support16BitBoneIndex=True
r.AllowStaticLighting=False

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
